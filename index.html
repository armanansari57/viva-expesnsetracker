<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pocket - Expense Tracker</title>

    <link rel="stylesheet" href="index.css">
    <script src="index.js" defer></script>
</head>

<body>

    <div class="container">

        <header>
            <div class="logo">pocket.</div>
            <div class="date" id="today"></div>
        </header>

        <main>

            <h1>Your Expenses</h1>
            <p class="subtitle">
                Keep track of the small things. They add up.
            </p>

            <!-- Summary -->

            <section class="summary">

                <div class="card primary">
                    <p>Spent This Month</p>
                    <h2 id="monthTotal">₹0.00</h2>
                </div>

                <div class="card">
                    <p>All Expenses</p>
                    <h2 id="allTotal">₹0.00</h2>
                </div>

                <div class="card">
                    <p>Total Entries</p>
                    <h2 id="entryCount">0</h2>
                </div>

            </section>

            <section class="content">

                <!-- Expense Form -->

                <div class="panel">

                    <h3>Add an Expense</h3>

                    <form id="expenseForm">

                        <label for="title">Expense Name</label>
                        <input
                            type="text"
                            id="title"
                            placeholder="e.g. Lunch with friends"
                            maxlength="55"
                            required
                        >

                        <label for="amount">Amount (₹)</label>
                        <input
                            type="number"
                            id="amount"
                            placeholder="Enter amount"
                            min="0.01"
                            step="0.01"
                            required
                        >

                        <label for="category">Category</label>
                        <select id="category">
                            <option value="Food">Food</option>
                            <option value="Travel">Travel</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Bills">Bills</option>
                            <option value="Study">Study</option>
                            <option value="Other">Other</option>
                        </select>

                        <label for="date">Date</label>
                        <input
                            type="date"
                            id="date"
                            required
                        >

                        <button type="submit" class="add-btn">
                            Add Expense
                        </button>

                    </form>

                </div>

                <!-- Expense List -->

                <div class="panel">

                    <div class="list-header">

                        <h3>Recent Activity</h3>

                        <select id="filter" class="filter">
                            <option value="All">All Categories</option>
                            <option value="Food">Food</option>
                            <option value="Travel">Travel</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Bills">Bills</option>
                            <option value="Study">Study</option>
                            <option value="Other">Other</option>
                        </select>

                    </div>

                    <div id="transactions"></div>

                </div>

            </section>

        </main>

    </div>

</body>
</html>
